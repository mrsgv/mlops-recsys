name: CD - Deploy Recommendation API

# Fires on every push to develop, which includes a squash-merge. There is
# deliberately no path filter on the model artifacts, because the manifest is
# the thing that changes when a model is promoted — but docs-only commits are
# excluded so writing the README does not redeploy the service.
on:
  push:
    branches:
      - develop
    paths-ignore:
      - "**/*.md"
      - "docs/**"

# Two pushes in quick succession would otherwise race two `gcloud run deploy`
# calls against one service, and whichever finished last would win regardless
# of which commit it carried.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: mlops-project-505217
  REGION: asia-south1
  REPOSITORY: cloud-run-source-deploy
  IMAGE_NAME: mlops-recsys-api
  SERVICE_NAME: recommendation-api

jobs:
  # CD does not build the image, so it can only deploy a tag that already
  # exists. Running the tests here first means a red suite cannot reach
  # production: the two workflows previously fired on the same push and ran in
  # parallel, so a failing test did not stop a deploy.
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: |
          python -m pytest -q

  deploy:
    name: Deploy promoted model
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read promoted model version
        id: model
        shell: bash
        run: |
          MODEL_VERSION=$(python - <<'PY'
          import json

          with open("models/deployment/deployment_manifest.json") as f:
              manifest = json.load(f)

          print(manifest["model"]["version"])
          PY
          )

          echo "MODEL_VERSION=$MODEL_VERSION"
          echo "model_version=$MODEL_VERSION" >> "$GITHUB_OUTPUT"

          # derive_model_version falls back to "<family>-unversioned" when the
          # promoted artifact has no DVC pointer. Deploying that would put a
          # model into production that cannot be resolved back to its bytes.
          case "$MODEL_VERSION" in
            ""|*unversioned)
              echo "::error::The manifest reports '$MODEL_VERSION', so the promoted model is not DVC-tracked. Run 'dvc add models/promoted && dvc push', rebuild the manifest and commit it. Refusing to deploy an unreproducible model."
              exit 1
              ;;
          esac

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # The image tag is derived from the promoted model's DVC content hash,
      # but nothing in this repository builds the image — so the tag and the
      # image come from two unsynchronised processes. Promoting a model and
      # committing the manifest without first pushing a matching image used to
      # fail inside `gcloud run deploy` with an unhelpful pull error. Checking
      # the precondition explicitly turns that into an actionable message.
      - name: Verify the promoted image exists
        shell: bash
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ steps.model.outputs.model_version }}"

          echo "Looking for: $IMAGE_URI"

          if gcloud artifacts docker images describe "$IMAGE_URI" >/dev/null 2>&1
          then
            echo "Image found."
            exit 0
          fi

          echo "::error::No image exists at $IMAGE_URI."
          echo
          echo "The manifest promotes model version" \
            "'${{ steps.model.outputs.model_version }}', but no image is" \
            "tagged with it. CD does not build images, so the build must" \
            "happen before the manifest is committed:"
          echo
          echo "  docker build --platform linux/amd64 -t $IMAGE_URI ."
          echo "  docker push $IMAGE_URI"
          echo
          echo "Then re-run this workflow. The currently deployed revision is" \
            "untouched."

          exit 1

      - name: Deploy promoted image to Cloud Run
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ steps.model.outputs.model_version }}"

          echo "Deploying: $IMAGE_URI"

          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --image="$IMAGE_URI" \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --port=8000 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --allow-unauthenticated \
            --set-env-vars="MODEL_VERSION=${{ steps.model.outputs.model_version }}"

      - name: Smoke test Cloud Run
        shell: bash
        run: |
          SERVICE_URL=$(gcloud run services describe \
            "${{ env.SERVICE_NAME }}" \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --format="value(status.url)")

          echo "Service URL: $SERVICE_URL"

          for i in {1..12}; do
            if curl -fsS "$SERVICE_URL/health"; then
              echo
              echo "Cloud Run health check passed."
              exit 0
            fi

            echo "Waiting for Cloud Run..."
            sleep 5
          done

          echo "Cloud Run health check failed."
          exit 1
