# Test discovery is pinned to tests/ on purpose.
#
# infra/mlflow/smoke_test.py is an operational script that exits when
# MLFLOW_TRACKING_URI is unset, not a unit test. Without testpaths, pytest
# collects it, the SystemExit aborts collection, and the whole suite fails
# to run.

[pytest]
testpaths = tests
python_files = test_*.py
